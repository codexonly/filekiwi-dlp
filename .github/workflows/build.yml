name: Build

# Reusable build job. Called by release.yml (stable) and nightly.yml.
#
# Matrix notes
#   * The SEA blob is arch independent, so arm64 artifacts are produced by
#     injecting it into the official arm64 Node binary on an x64 runner
#     (build.mjs --target). No arm runners needed.
#   * macOS is intentionally not built here (see docs/MAINTENANCE.md §11).
#   * smoke test only runs where the target arch matches the runner.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string: YYYY.MM.DD[.rev] for stable, YYYY.MM.DD.HHMMSS for nightly'
        required: true
        type: string
      channel:
        description: 'stable | nightly'
        required: false
        type: string
        default: stable

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64,     runner: windows-latest }
          - { target: win-arm64,   runner: windows-latest }
          - { target: linux-x64,   runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose: every artifact embeds this exact Node version, so
      # bumping it changes all deliverables. Bump deliberately.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm

      - name: Install build dependency (postject, locked in package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Sanity check
        run: node --check cli.js

      - name: Build ${{ matrix.target }}
        run: node build.mjs --version "${{ inputs.version }}" --channel "${{ inputs.channel }}" --target "${{ matrix.target }}" --git-head "${{ github.sha }}"

      - name: Smoke test (windows x64)
        if: matrix.target == 'win-x64'
        run: .\dist\filekiwi-${{ inputs.version }}-win-x64\filekiwi.exe --version

      - name: Smoke test (linux x64)
        if: matrix.target == 'linux-x64'
        run: ./dist/filekiwi-${{ inputs.version }}-linux-x64/filekiwi --version

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pkg-*
          merge-multiple: true

      - name: Merge checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd artifacts
          files=(*.zip *.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no release assets found"
            exit 1
          fi
          ls -lh "${files[@]}"
          sha256sum "${files[@]}" | sort -k2 > SHA2-256SUMS
          echo '--- SHA2-256SUMS'
          cat SHA2-256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
