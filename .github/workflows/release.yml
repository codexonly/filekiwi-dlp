name: Release

# Stable releases, yt-dlp style:
#   * version = YYYY.MM.DD (optionally .N for a second release on the same day)
#   * tag     = the version itself, no "v" prefix
#   * assets  = filekiwi-<version>-win-x64.zip + SHA2-256SUMS
#
# Triggers:
#   * push a tag that looks like a version  -> publish that version
#   * manual run (Actions -> Release)       -> version input, or today's date (UTC)

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YYYY.MM.DD or YYYY.MM.DD.N). Empty = today (UTC)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            V="$REF_NAME"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            V="$INPUT_VERSION"
          else
            V="$(date -u +%Y.%m.%d)"
          fi
          if ! [[ "$V" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.([0-9]|[1-9][0-9]))?$ ]]; then
            echo "::error::version must be YYYY.MM.DD or YYYY.MM.DD.N, got '$V'"
            exit 1
          fi
          if [[ "$REF_TYPE" != "tag" ]] && gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${V}" >/dev/null 2>&1; then
            echo "::error::tag ${V} already exists; pass a version like ${V}.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [version]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      channel: stable

  publish:
    name: Publish
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ inputs.prerelease && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # need tags for the changelog

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifact
          merge-multiple: true

      - name: Generate release notes
        run: |
          set -euo pipefail
          PREV="$(git tag --sort=-v:refname | grep -E '^[0-9]{4}\.' | grep -vx "${VERSION}" | head -n1 || true)"
          {
            echo "**filekiwi ${VERSION}**"
            echo
            if [[ -n "$PREV" ]]; then
              echo "Changes since [\`${PREV}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${VERSION}):"
            else
              echo "Changes:"
            fi
            echo
            echo '```'
            git log --no-merges --pretty='%h %s' ${PREV:+${PREV}..HEAD} | head -n 100
            echo '```'
            echo
            cat <<'EOF'
          ### Download

          | Asset | Platform |
          |---|---|
          | `filekiwi-*-win-x64.zip` | Windows 10/11 x64 |
          | `filekiwi-*-win-arm64.zip` | Windows 11 ARM64 |
          | `filekiwi-*-linux-x64.tar.gz` | Linux x86_64 (glibc) |
          | `filekiwi-*-linux-arm64.tar.gz` | Linux aarch64 (glibc) |

          Every archive contains the binary (`filekiwi.exe` / `filekiwi`), the
          unminified `cli.js`, `README.txt` and `build-info.txt`.

          ```bash
          # Linux
          tar -xzf filekiwi-*-linux-x64.tar.gz
          ./filekiwi --version
          ```

          ### Verify

          ```
          sha256sum -c SHA2-256SUMS          # Linux
          certutil -hashfile <zip> SHA256    # Windows
          ```

          > Unofficial tool. Only download content you have the right to access.

          > The binaries are unsigned (they are patched Node runtimes), so
          > Windows SmartScreen will warn: *More info → Run anyway*.
          EOF
          } > notes.md

      - name: Create tag (manual runs only)
        if: github.ref_type != 'tag'
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          opts=(--title "filekiwi ${VERSION}" --notes-file notes.md --verify-tag)
          if [[ "$PRERELEASE" == "1" ]]; then opts+=(--prerelease); fi
          gh release create "$VERSION" "${opts[@]}" artifact/*
